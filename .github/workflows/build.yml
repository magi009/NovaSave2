name: Compilar NovaSave2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar switch-zlib
        run: |
          if dkp-pacman -Q switch-zlib; then exit 0; fi
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm --needed switch-zlib && exit 0
            echo "Reintento $i"; sleep 20
          done
          exit 1

      - name: Instalar Ounce Devkit 20261117
        run: |
          cd devkit
          sha256sum -c ounce-devkit-20261117.tar.xz.sha256
          tar -xJf ounce-devkit-20261117.tar.xz -C "$DEVKITPRO"
          cat "$DEVKITPRO/ounce-devkit-version.txt"

      - name: Compilar
        run: |
          cd codigo-fuente
          make clean
          make
          ls -l NovaSave2.nro
          sha256sum NovaSave2.nro

      - uses: actions/upload-artifact@v4
        with:
          name: NovaSave2-0.4.13
          path: codigo-fuente/NovaSave2.nro

      - name: Publicar el .nro en la rama compilado
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir /tmp/out
          cp codigo-fuente/NovaSave2.nro /tmp/out/
          (cd /tmp/out && sha256sum NovaSave2.nro > NovaSave2.nro.sha256)
          cd /tmp/out
          git init -q -b compilado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "NovaSave2.nro de ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" compilado
